# Release Drafter config, self-contained (no _extends from the Jellyfin org).
# Versions are semver MAJOR.MINOR.PATCH, derived from the last PUBLISHED
# release (currently 1.0.0). Tags have no "v" prefix, matching existing
# releases and publish.yaml, which passes the tag to JPRM as the plugin
# version. The stale integer tags v1..v23 inherited from upstream are
# ignored because the resolver only looks at published releases.
name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'

version-resolver:
  major:
    labels:
      - breaking
      - removed
  minor:
    labels:
      - major-enhancement
      - major-feature
      - enhancement
      - feature
  patch:
    labels:
      - bug
      - fix
      - bugfix
      - regression
      - chore
      - cleanup
      - documentation
      - dependencies
      - dependency
      - ci
      - build
      - test
      - tests
      - revert
      - reverted
  default: patch

category-template: '### $TITLE'

# Emoji reference: https://gitmoji.carloscuesta.me/
categories:
  - title: ':boom: Breaking changes'
    labels:
      - breaking
  - title: ':fire: Removed'
    labels:
      - removed
  - title: ':rewind: Reverted Changes'
    labels:
      - revert
      - reverted
  - title: ':rocket: Major features and improvements'
    labels:
      - major-enhancement
      - major-feature
  - title: ':ambulance: Major bug fixes'
    labels:
      - major-bug
  - title: ':wastebasket:️ Deprecated'
    label: deprecated
  - title: ':tada: New features and improvements'
    labels:
      - enhancement
      - feature
  - title: ':bug: Bug Fixes'
    labels:
      - bug
      - fix
      - bugfix
      - regression
  - title: ':white_check_mark: Tests'
    labels:
      - test
      - tests
  - title: ':gear: Code or Repo Maintenance'
    labels:
      - chore
      - cleanup
  - title: ':memo: Documentation updates'
    labels:
      - documentation
  - title: ':arrow_up: Dependency updates'
    labels:
      - dependencies # Default label used by Dependabot
      - dependency
  - title: ':construction_worker: CI & build changes'
    labels:
      - ci
      - build
exclude-labels:
  - no-changelog
  - skip-changelog
  - invalid

autolabeler:
  - label: ci
    files:
      - '.github/workflows/*'
      - '.github/dependabot.yml'
    branch:
      - '/ci\/.+/'
  - label: documentation
    files:
      - '*.md'
    branch:
      - '/docs?\/.+/'
  - label: bug
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: chore
    branch:
      - '/chore\/.+/'
    title:
      - '/chore/i'
  - label: feature
    branch:
      - '/feature\/.+/'

template: |
  <!-- Optional: add a release summary here -->

  ## :sparkles: What's New

  $CHANGES
