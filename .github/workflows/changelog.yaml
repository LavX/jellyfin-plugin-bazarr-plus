name: '📝 Create/Update Release Draft & Release Bump PR'

on:
  push:
    branches:
      - master
    paths-ignore:
      - build.yaml
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

jobs:
  call:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@master
    with:
      repository-name: LavX/jellyfin-plugin-bazarr-plus
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
